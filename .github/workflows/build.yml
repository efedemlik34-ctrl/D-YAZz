name: Turkce Karakter Uyumlu APK Derleme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk-derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depodaki Dosyalara Eris
        uses: actions/checkout@v4

      - name: ZIP Dosyasini Ac ve Ismi Otomatik Duzelt
        run: |
          # 1. ZIP dosyasını açıyoruz
          unzip -o *.zip
          
          # 2. "kaynak kodlarını" veya benzeri Türkçe isimli klasörleri bulup ismini değiştiriyoruz
          # Klasör adındaki boşluk ve Türkçe karakter sorununu kökten çözer
          find . -maxdepth 1 -type d ! -name "." ! -name ".*" -exec mv {} ./android_proje \; 2>/dev/null || true
          
          echo "Klasör ismi 'android_proje' olarak güvenli hale getirildi."
          
          # 3. build.gradle dosyasının yerini yeni klasörün içinde doğrula
          PROJE_YOLU=$(find android_proje -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJE_YOLU" ]; then
            echo "HATA: Klasör içinde build.gradle bulunamadı!"
            exit 1
          fi
          
          echo "PROJE_DIZINI=$PROJE_YOLU" >> $GITHUB_ENV

      - name: Java Ortamini Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: APK Dosyasini Derle (Build)
        run: |
          # İsmi düzeltilen klasörün içine güvenle giriyoruz
          cd "${{ env.PROJE_DIZINI }}"
          
          chmod +x gradlew || true
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Uretilen APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Android-Uygulama-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
