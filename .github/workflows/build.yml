name: Sifirdan Android Projesi Olustur ve Derle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  proje-olustur-ve-derle:
    runs-on: ubuntu-latest

    steps:
      - name: Depodaki Dosyalara Eris
        uses: actions/checkout@v4

      - name: Java Ortamini Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Proje Kalibini Sifirdan Olustur
        run: |
          echo "=== 1. Temel Proje Yapisi ==="
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          echo "=== 2. Yapilandirma Dosyalari ==="
          echo "rootProject.name = 'OtomatikAndroidProjesi'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "=== 3. Kaynak Dosyalari Tasiniyor (Gelistirilmis Akilli Tasima) ==="
          
          # XML dosyalarını temizleyerek taşıyoruz
          find . -maxdepth 5 -name "*.xml" ! -name "build.gradle" ! -name "AndroidManifest.xml" ! -path "*/app/*" | while read -r dosya; do
              dosya_adi=$(basename "$dosya")
              # Dosya adında HERHANGİ bir yerinde '$' işareti varsa bu sistem artığıdır, atla
              if [[ "$dosya_adi" == *\$* ]]; then
                  echo "Sistem dosyası temizlendi: $dosya_adi"
              else
                  temiz_ad=$(echo "$dosya_adi" | tr 'A-Z' 'a-z')
                  cp "$dosya" "app/src/main/res/layout/$temiz_ad" || true
              fi
          done

          # Java dosyalarını paket adlarına göre dinamik klasör oluşturarak taşıyoruz
          find . -maxdepth 5 -name "*.java" ! -path "*/app/*" | while read -r java_dosya; do
              # Java dosyasının içindeki gerçek package satırını buluyoruz (Örn: package com.test.app;)
              PAKET_SATIRI=$(grep -E "^package " "$java_dosya" | head -n 1 || true)
              if [ -n "$PAKET_SATIRI" ]; then
                  # "package " kısmını ve sondaki ";" işaretini silip klasör yoluna dönüştürüyoruz (com/test/app)
                  PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                  mkdir -p "app/src/main/java/$PAKET_YOLU"
                  cp "$java_dosya" "app/src/main/java/$PAKET_YOLU/"
                  echo "Java dosyası kendi orijinal paket yoluna taşındı: $PAKET_YOLU/$(basename "$java_dosya")"
              else
                  # Eğer package yazmıyorsa varsayılan ana dizine at
                  mkdir -p app/src/main/java/com/example/otomatikuygulama
                  cp "$java_dosya" app/src/main/java/com/example/otomatikuygulama/
              fi
          done

          # Temel Manifest dosyasını yaz
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
             cat << 'EOF' > app/src/main/AndroidManifest.xml
             <manifest xmlns:android="http://android.com">
                 <application
                     android:allowBackup="true"
                     android:label="Otomatik Uygulama"
                     android:theme="@android:style/Theme.DeviceDefault">
                     <activity android:name=".MainActivity" android:exported="true">
                         <intent-filter>
                             <action android:name="android.intent.action.MAIN" />
                             <category android:name="android.intent.category.LAUNCHER" />
                         </intent-filter>
                     </activity>
                 </application>
             </manifest>
          EOF
          fi

      - name: Gradle Sistemini Yukle ve APK Derle
        run: |
          echo "=== 4. APK Derleme Islemi Baslatiliyor ==="
          # Hatanın kökenini tam döküm alabilmek için --stacktrace ekledik
          gradle assembleDebug --project-dir . --stacktrace

      - name: Uretilen APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Android-Uygulama-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
