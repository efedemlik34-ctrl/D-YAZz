name: Klasorden Doğrudan APK Derleme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk-derle:
    runs-on: ubuntu-latest

    steps:
      - name: Depodaki Dosyalara Eris
        uses: actions/checkout@v4

      - name: Proje Klasorunu Otomatik Kokla ve Bul
        run: |
          # Klasör adı ne olursa olsun (boşluklu, Türkçe) build.gradle dosyasını bulur
          PROJE_YOLU=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJE_YOLU" ]; then
            echo "HATA: Depoda hiçbir Android projesi (build.gradle) bulunamadı!"
            exit 1
          fi
          
          echo "Proje başarıyla tespit edildi: $PROJE_YOLU"
          echo "PROJE_DIZINI=$PROJE_YOLU" >> $GITHUB_ENV

      - name: Java Ortamini Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: APK Dosyasini Derle (Build)
        run: |
          # Tespit edilen o klasörün içine güvenli şekilde giriş yapıyoruz
          cd "${{ env.PROJE_DIZINI }}"
          
          chmod +x gradlew || true
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Uretilen APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Android-Uygulama-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
