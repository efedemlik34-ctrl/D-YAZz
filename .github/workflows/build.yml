name: Sifirdan Android Projesi Olustur ve Derle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  proje-olustur-ve-derle:
    runs-on: ubuntu-latest

    steps:
      - name: Depodaki Dosyalara Eris
        uses: actions/checkout@v4

      - name: Java Ortamini Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Proje Kalibini Sifirdan Olustur
        run: |
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          echo "rootProject.name = 'OtomatikAndroidProjesi'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # XML taşıma
          find . -maxdepth 5 -name "*.xml" ! -name "build.gradle" ! -name "AndroidManifest.xml" ! -path "*/app/*" | while read -r dosya; do
              dosya_adi=$(basename "$dosya")
              if [[ "$dosya_adi" != *\$* ]]; then
                  temiz_ad=$(echo "$dosya_adi" | tr 'A-Z' 'a-z')
                  cp "$dosya" "app/src/main/res/layout/$temiz_ad" || true
              fi
          done

          # Java taşıma
          find . -maxdepth 5 -name "*.java" ! -path "*/app/*" | while read -r java_dosya; do
              PAKET_SATIRI=$(grep -E "^package " "$java_dosya" | head -n 1 || true)
              if [ -n "$PAKET_SATIRI" ]; then
                  PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                  mkdir -p "app/src/main/java/$PAKET_YOLU"
                  cp "$java_dosya" "app/src/main/java/$PAKET_YOLU/"
              else
                  mkdir -p app/src/main/java/com/example/otomatikuygulama
                  cp "$java_dosya" app/src/main/java/com/example/otomatikuygulama/
              fi
          done

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
             cat << 'EOF' > app/src/main/AndroidManifest.xml
             <manifest xmlns:android="http://android.com">
                 <application
                     android:allowBackup="true"
                     android:label="Otomatik Uygulama"
                     android:theme="@android:style/Theme.DeviceDefault">
                     <activity android:name=".MainActivity" android:exported="true">
                         <intent-filter>
                             <action android:name="android.intent.action.MAIN" />
                             <category android:name="android.intent.category.LAUNCHER" />
                         </intent-filter>
                     </activity>
                 </application>
             </manifest>
          EOF
          fi

      - name: APK Derle ve Hatayi Dosyaya Kaydet
        run: |
          # Derleme hatasını süzüp "hata_raporu.txt" isimli bir dosyaya yazdırıyoruz
          gradle assembleDebug --project-dir . --info > hata_raporu.txt 2>&1 || true

      - name: Hata Raporunu Disari Aktar
        uses: actions/upload-artifact@v4
        with:
          name: Derleme-Hata-Raporu
          path: hata_raporu.txt
          
