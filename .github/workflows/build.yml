name: Kesin Android APK Derleme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk-derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depodaki Dosyalara Eris
        uses: actions/checkout@v4

      - name: Java Ortamini Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Proje Kalibini Hazirla
        run: |
          echo "=== 1. Klasorler Hazirlaniyor ==="
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          echo "=== 2. Yapilandirma Yaziliyor ==="
          echo "rootProject.name = 'OtomatikAndroidProjesi'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "=== 3. Temiz Kodlar Klasore Aktariliyor ==="
          # Temiz XML'ler taşınıyor
          find . -maxdepth 5 -name "*.xml" ! -name "build.gradle" ! -name "AndroidManifest.xml" ! -path "*/app/*" | while read -r dosya; do
              dosya_adi=$(basename "$dosya")
              if [[ "$dosya_adi" != *\$* ]]; then
                  temiz_ad=$(echo "$dosya_adi" | tr 'A-Z' 'a-z')
                  cp "$dosya" "app/src/main/res/layout/$temiz_ad" || true
              fi
          done

          # Java'lar orijinal paket adlarına göre taşınıyor
          find . -maxdepth 5 -name "*.java" ! -path "*/app/*" | while read -r java_dosya; do
              PAKET_SATIRI=$(grep -E "^package " "$java_dosya" | head -n 1 || true)
              if [ -n "$PAKET_SATIRI" ]; then
                  PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                  mkdir -p "app/src/main/java/$PAKET_YOLU"
                  cp "$java_dosya" "app/src/main/java/$PAKET_YOLU/"
              else
                  mkdir -p app/src/main/java/com/example/otomatikuygulama
                  cp "$java_dosya" app/src/main/java/com/example/otomatikuygulama/
              fi
          done

          # Temel Manifest yazılıyor
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
             cat << 'EOF' > app/src/main/AndroidManifest.xml
             <manifest xmlns:android="http://android.com">
                 <application
                     android:allowBackup="true"
                     android:label="Otomatik Uygulama"
                     android:theme="@android:style/Theme.DeviceDefault">
                     <activity android:name=".MainActivity" android:exported="true">
                         <intent-filter>
                             <action android:name="android.intent.action.MAIN" />
                             <category android:name="android.intent.category.LAUNCHER" />
                         </intent-filter>
                     </activity>
                 </application>
             </manifest>
          EOF
          fi

      - name: Gercek APK Derlemesini Baslat
        run: |
          echo "=== 4. APK Uretimi Basladi ==="
          # || true komutunu kaldırdık, gerçek derleme yapıyor
          gradle assembleDebug --project-dir .

      - name: Uretilen APK'yi Ana Dizine Topla
        run: |
          # Üretilen APK'yı bulup kolay erişim için ana dizine taşıyoruz
          mkdir -p ciktilar
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} ciktilar/uygulama.apk \; || echo "APK kopyalanamadi!"

      - name: APK Dosyasini Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Hazir-Android-Uygulamasi
          path: ciktilar/uygulama.apk
          if-no-files-found: error
          
