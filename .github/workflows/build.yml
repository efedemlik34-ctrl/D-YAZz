name: Belirli Klasoru ZIP icinden Cikar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  klasor-cikar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depodaki Dosyalara Eris
        uses: actions/checkout@v4

      - name: Sadece kaynak kodlarini Klasorunu Cikar
        run: |
          # Depodaki .zip dosyasını bulur ve sadece "kaynak kodlarını" klasörünü ve içindekileri çıkarır
          # Not: Klasör adındaki boşluklar ve Türkçe karakterler için tırnak kullanılmıştır.
          
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "$f içinden 'kaynak kodlarını' klasörü çıkarılıyor..."
              unzip -o "$f" "kaynak kodlarını/*"
              rm "$f" # İşlem bitince ZIP dosyasını siler
            fi
          done

      - name: Degisiklikleri Github'a Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff-index --quiet HEAD || git commit -m "Build: kaynak kodlarını klasörü ZIP'ten çıkarıldı"
          git push origin main
          
