name: Sifirdan Android Projesi Olustur ve Derle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  proje-olustur-ve-derle:
    runs-on: ubuntu-latest

    steps:
      - name: Depodaki Dosyalara Eris
        uses: actions/checkout@v4

      - name: Java Ortamini Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Proje Kalibini Sifirdan Olustur
        run: |
          echo "=== 1. Proje Yapisi Hazirlaniyor ==="
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          echo "=== 2. Yapilandirma Dosyalari Olusturuluyor ==="
          echo "rootProject.name = 'OtomatikAndroidProjesi'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo "=== 3. Kodlar Tasiniyor ve Isim Hatalari Tamir Ediliyor ==="
          # Java kodlarını taşıyoruz
          find . -maxdepth 5 -name "*.java" ! -path "*/app/*" -exec cp {} app/src/main/java/ \; || true
          
          # XML dosyalarını taşırken ismi '$' ile başlayan hatalı dosyaları eliyoruz
          find . -maxdepth 5 -name "*.xml" ! -name "build.gradle" ! -name "AndroidManifest.xml" ! -path "*/app/*" | while read -r dosya; do
              dosya_adi=$(basename "$dosya")
              # Eğer dosya adında '$' işareti varsa bunu derleme klasörüne kopyalama (Sistem dosyası artığıdır)
              if [[ "$dosya_adi" == \$* ]]; then
                  echo "Hatalı sistem dosyası atlandı: $dosya_adi"
              else
                  # Dosya adını tamamen küçük harfe çevirerek kopyala (Android kuralı)
                  temiz_ad=$(echo "$dosya_adi" | tr 'A-Z' 'a-z')
                  cp "$dosya" "app/src/main/res/layout/$temiz_ad" || true
              fi
          done

          # Temel Manifest dosyasını kontrol et ve yoksa yaz
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
             cat << 'EOF' > app/src/main/AndroidManifest.xml
             <manifest xmlns:android="http://android.com">
                 <application
                     android:allowBackup="true"
                     android:label="Otomatik Uygulama"
                     android:theme="@android:style/Theme.DeviceDefault">
                     <activity android:name=".MainActivity" android:exported="true">
                         <intent-filter>
                             <action android:name="android.intent.action.MAIN" />
                             <category android:name="android.intent.category.LAUNCHER" />
                         </intent-filter>
                     </activity>
                 </application>
             </manifest>
          EOF
          fi

      - name: Gradle Sistemini Yukle ve APK Derle
        run: |
          echo "=== 4. APK Derleme Islemi Baslatiliyor ==="
          gradle assembleDebug --project-dir .

      - name: Uretilen APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Android-Uygulama-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
